<div class="app-shell">
  <app-topbar
    (menuToggle)="menuOpen = !menuOpen"
    (authError)="showToast($event)"
  ></app-topbar>

  <app-trip-sidebar
    [trips]="state.trips"
    [activeTripId]="state.activeTripId"
    [open]="menuOpen"
    (selectTrip)="selectTrip($event)"
    (createTrip)="openTripDialog()"
    (joinTrip)="openJoinTripDialog()"
    (close)="menuOpen = false"
  >
  </app-trip-sidebar>

  <main class="main-content">
    <app-empty-trip
      *ngIf="!activeTrip"
      (createTrip)="openTripDialog()"
    ></app-empty-trip>

    <app-itinerary
      *ngIf="activeTrip"
      [trip]="activeTrip"
      [activeDayId]="activeDayId"
      [canDeleteTrip]="canDeleteActiveTrip"
      (daySelected)="selectDay($event)"
      (addEvent)="openEventDialog()"
      (editTrip)="openEditTrip()"
      (openLedger)="openExpenseDrawer()"
      (deleteEvent)="requestDeleteEvent($event)"
      (editEvent)="openEditEvent($event)"
      (deleteTrip)="requestDeleteTrip()"
      (openInvite)="openInviteDialog()"
      (createOption)="openOptionDialog()"
      (optionSelected)="openOptionInEventDialog($event)"
      (optionDropped)="openOptionInEventDialog($event)"
      (editOption)="openEditOption($event)"
      (deleteOption)="requestDeleteOption($event)"
      (editDayNote)="openDayNoteDialog()"
      (editSegmentNote)="openSegmentNoteDialog($event)"
    >
    </app-itinerary>
  </main>

  <app-floating-actions
    [disabled]="!activeTrip"
    (addEvent)="openEventDialog()"
    (openLedger)="openExpenseDrawer()"
  >
  </app-floating-actions>

  <app-expense-drawer
    [trip]="activeTrip"
    [currentUserId]="currentUserId"
    [open]="ledgerOpen"
    (close)="ledgerOpen = false"
    (addExpense)="openExpenseDialog()"
    (editExpense)="openEditExpense($event)"
    (editEvent)="openEditPaidEvent($event)"
  >
  </app-expense-drawer>

  <app-trip-dialog
    [trip]="editingTrip"
    [open]="tripDialogOpen"
    [currentUserName]="currentUserName"
    (closed)="closeTripDialog()"
    (saved)="saveTrip($event)"
  >
  </app-trip-dialog>

  <app-trip-invite-dialog
    [open]="inviteDialogOpen"
    [trip]="activeTrip"
    (closed)="inviteDialogOpen = false"
    (copied)="showInviteCopied($event)"
  >
  </app-trip-invite-dialog>

  <app-join-trip-dialog
    [open]="joinTripDialogOpen"
    [submitting]="joinTripBusy"
    (closed)="joinTripDialogOpen = false"
    (saved)="joinTrip($event)"
  >
  </app-join-trip-dialog>

  <app-event-dialog
    [event]="editingEvent"
    [initialValues]="eventInitialValues"
    [open]="eventDialogOpen"
    (closed)="closeEventDialog()"
    (saved)="addEvent($event)"
  >
  </app-event-dialog>

  <app-expense-dialog
    [trip]="activeTrip"
    [expense]="editingExpense"
    [currentUserId]="currentUserId"
    [currentUserName]="currentUserName"
    [open]="expenseDialogOpen"
    (closed)="closeExpenseDialog()"
    (saved)="addExpense($event)"
  >
  </app-expense-dialog>

  <app-trip-option-dialog
    [open]="optionDialogOpen"
    [editingOption]="editingOption"
    (closed)="closeOptionDialog()"
    (saved)="saveOption($event)"
  >
  </app-trip-option-dialog>

  <app-confirm-dialog
    [open]="duplicateDialogOpen"
    title="這個地點可能重複了"
    [message]="duplicateMessage"
    [confirmLabel]="editingOption ? '仍要儲存' : '仍要新增'"
    confirmClass="primary-button"
    (closed)="closeDuplicateDialog()"
    (confirmed)="confirmDuplicateOption()"
  >
  </app-confirm-dialog>

  <app-day-note-dialog
    [open]="dayNoteDialogOpen"
    [note]="activeDayNote"
    (closed)="closeDayNoteDialog()"
    (saved)="saveDayNote($event)"
  >
  </app-day-note-dialog>

  <app-day-note-dialog
    [open]="segmentNoteDialogOpen"
    [note]="segmentNoteText"
    kicker="行程之間"
    heading="交通資訊／備註"
    label="備註"
    placeholder="例如：搭地鐵銀座線 20 分鐘、步行 5 分鐘（清空後儲存即可移除）"
    submitLabel="儲存備註"
    [maxLength]="200"
    [rows]="4"
    (closed)="closeSegmentNoteDialog()"
    (saved)="saveSegmentNote($event)"
  >
  </app-day-note-dialog>

  <app-confirm-dialog
    [open]="confirmDialogOpen"
    [title]="confirmTitle"
    [message]="confirmMessage"
    (closed)="closeConfirmDialog()"
    (confirmed)="confirmDelete()"
  >
  </app-confirm-dialog>

  <div class="toast" *ngIf="toastMessage" role="status" aria-live="polite">
    {{ toastMessage }}
  </div>
</div>
