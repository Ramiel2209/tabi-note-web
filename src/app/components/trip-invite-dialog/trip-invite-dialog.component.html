<div class="modal-backdrop" *ngIf="open" (click)="closed.emit()"></div>
<section class="app-modal collaboration-modal invite-modal" *ngIf="open" role="dialog" aria-modal="true" aria-labelledby="inviteDialogTitle">
  <div class="dialog-heading">
    <div><p class="section-kicker">把旅程交給旅伴</p><h2 id="inviteDialogTitle">邀請一起去的人</h2></div>
    <button class="close-button" type="button" aria-label="關閉" (click)="closed.emit()">×</button>
  </div>
  <p class="dialog-description">把這組邀請碼傳給旅伴，對方登入 Google 後輸入邀請碼，就能加入這趟旅程。</p>
  <div class="invite-code-card">
    <span class="invite-code-label">旅程邀請碼</span>
    <strong class="invite-code-value" aria-label="旅程邀請碼">{{ trip?.inviteCode || '準備中…' }}</strong>
    <button class="secondary-button copy-code-button" type="button" [disabled]="!trip?.inviteCode" (click)="copyCode()">{{ copyFeedback || '複製邀請碼' }}</button>
  </div>
  <section class="member-section" aria-labelledby="memberHeading">
    <div class="member-section-heading"><h3 id="memberHeading">一起去的旅伴</h3><span>{{ members.length }} 人</span></div>
    <div class="member-list">
      <div class="member-row" *ngFor="let member of members">
        <img *ngIf="member.photoURL" class="member-avatar" [src]="member.photoURL" alt="" />
        <span *ngIf="!member.photoURL" class="member-avatar member-avatar-fallback" aria-hidden="true">{{ member.displayName.slice(0, 1) }}</span>
        <span class="member-name">{{ member.displayName }}</span>
        <span class="member-role" *ngIf="isOwner(member)">建立者</span>
      </div>
    </div>
  </section>
  <div class="dialog-actions"><button class="primary-button" type="button" (click)="closed.emit()">知道了</button></div>
</section>
