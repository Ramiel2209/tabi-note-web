<section class="panel options-panel" aria-labelledby="optionsHeading">
  <div class="panel-heading options-heading"><div><p class="section-kicker">先放進口袋</p><h2 id="optionsHeading">行程備選</h2><p class="options-intro">每天都會看到這份想去清單；拖到上方，或直接加入今天。</p></div><button class="secondary-button section-action-button" type="button" (click)="createOption.emit()">＋ 新增備選</button></div>
  <div class="option-list" *ngIf="options.length > 0; else emptyOptions">
    <article class="option-card" *ngFor="let option of options" draggable="true" tabindex="0" (click)="onOptionClick($event, option)" (keydown)="onOptionKeydown($event, option)" (dragstart)="onDragStart($event, option)">
      <span class="drag-handle" aria-hidden="true">⠿</span>
      <div class="option-copy"><a class="place-title" [href]="safeUrl(option.mapsUrl)" target="_blank" rel="noreferrer">{{ option.title }} <span aria-hidden="true">↗</span></a><p>{{ option.note || '還沒有備註' }}</p></div>
      <div class="option-actions">
        <button class="option-add-button" type="button" (click)="useOptionClick($event, option.id)">加入今天</button>
        <button class="option-delete-button" type="button" aria-label="刪除備選" title="刪除備選" (click)="deleteOptionClick($event, option)">×</button>
      </div>
    </article>
  </div>
  <ng-template #emptyOptions><div class="options-empty">把還沒決定的景點放在這裡，之後每天都能拖出來安排。</div></ng-template>
</section>
