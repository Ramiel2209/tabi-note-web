<div class="modal-backdrop" *ngIf="open" (click)="closed.emit()"></div>
<section
  class="app-modal day-note-modal"
  *ngIf="open"
  role="dialog"
  aria-modal="true"
  aria-labelledby="dayNoteDialogTitle"
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="dialog-heading">
      <div>
        <p class="section-kicker">{{ kicker }}</p>
        <h2 id="dayNoteDialogTitle">{{ heading }}</h2>
      </div>
      <button
        class="close-button"
        type="button"
        aria-label="關閉"
        (click)="closed.emit()"
      >
        ×
      </button>
    </div>
    <label
      >{{ label
      }}<textarea
        formControlName="note"
        [attr.rows]="rows"
        [attr.maxlength]="maxLength"
        [placeholder]="placeholder"
      ></textarea>
    </label>
    <small
      class="field-error"
      *ngIf="form.controls.note.touched && form.controls.note.invalid"
      >{{ label }} 最多 {{ maxLength }} 字。</small
    >
    <div class="dialog-actions">
      <button class="secondary-button" type="button" (click)="closed.emit()">
        取消</button
      ><button class="primary-button" type="submit">{{ submitLabel }}</button>
    </div>
  </form>
</section>
